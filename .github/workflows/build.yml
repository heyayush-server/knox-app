name: Build Knox APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java (required for Android/Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # 4. Verify Flutter installation
      - name: Flutter doctor
        run: flutter doctor -v

      # 5. Create local.properties (required by legacy Flutter Gradle plugin)
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      # 6. Install dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 6. Generate Hive adapters (build_runner)
      - name: Generate code (Hive adapters)
        run: dart run build_runner build --delete-conflicting-outputs

      # 7. Build release APK (universal — works on all devices)
      - name: Build release APK
        run: flutter build apk --release --verbose
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: knox-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
