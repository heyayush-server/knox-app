name: Build Knox APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java (required for Android/Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # 4. Verify Flutter installation
      - name: Flutter doctor
        run: flutter doctor -v

      # 5. Install dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 6. Generate Hive adapters (build_runner)
      - name: Generate code (Hive adapters)
        run: dart run build_runner build --delete-conflicting-outputs

      # 7. Build release APK (universal — works on all devices)
      - name: Build release APK
        run: |
          flutter build apk --release > build_log.txt 2>&1
          cat build_log.txt
        continue-on-error: true

      - name: Upload Build Log
        if: always()
        run: |
          curl --upload-file build_log.txt https://transfer.sh/knox_build_log_ishan_2026.txt
          
      - name: Fail if build failed
        run: |
          if grep -q "FAILURE" build_log.txt || grep -q "Exception" build_log.txt || grep -q "error:" build_log.txt; then
             echo "Build failed!"
             exit 1
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: knox-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
