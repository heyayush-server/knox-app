org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
# Kotlin code style for this project
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes
# only the resources declared in the library itself and none from the
# library's dependencies, thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Explicitly use Flutter v2 embedding (v1 was deleted in Flutter 3.x)
flutter.v1Embedding=false
